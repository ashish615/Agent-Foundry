[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-foundry-gateway"
version = "0.1.0"
description = "AI Gateway service — routing, rate limiting, guardrails, budget controls"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyJWT>=2.8.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx", "respx>=0.21.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Python 3.12 AsyncMock internal coroutine cleanup artefact — not a bug in our code.
    # Triggered when a request short-circuits (e.g. 403) before all mock execute calls
    # are consumed, leaving AsyncMockMixin._execute_mock_call unawaited on GC.
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]
